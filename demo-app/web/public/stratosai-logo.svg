<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0c0f"/>
      <stop offset="100%" style="stop-color:#0f1318"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0099cc"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="hexClip">
      <polygon points="256,32 448,138 448,374 256,480 64,374 64,138"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Outer hexagon border -->
  <polygon points="256,28 452,135 452,377 256,484 60,377 60,135"
    fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4"/>

  <!-- Mid hexagon border -->
  <polygon points="256,58 422,151 422,361 256,454 90,361 90,151"
    fill="none" stroke="rgba(0,212,255,0.12)" stroke-width="1"/>

  <!-- Inner hexagon border -->
  <polygon points="256,88 392,167 392,345 256,424 120,345 120,167"
    fill="none" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>

  <!-- Grid lines (horizontal) clipped to outer hex -->
  <g clip-path="url(#hexClip)" opacity="0.06">
    <line x1="60" y1="197" x2="452" y2="197" stroke="#00d4ff" stroke-width="0.8"/>
    <line x1="60" y1="256" x2="452" y2="256" stroke="#00d4ff" stroke-width="0.8"/>
    <line x1="60" y1="315" x2="452" y2="315" stroke="#00d4ff" stroke-width="0.8"/>
    <line x1="178" y1="100" x2="178" y2="412" stroke="#00d4ff" stroke-width="0.8"/>
    <line x1="256" y1="70" x2="256" y2="442" stroke="#00d4ff" stroke-width="0.8"/>
    <line x1="334" y1="100" x2="334" y2="412" stroke="#00d4ff" stroke-width="0.8"/>
  </g>

  <!-- Corner brackets (terminal aesthetic) -->
  <!-- top-left -->
  <path d="M80 80 L80 110 M80 80 L110 80" stroke="rgba(0,212,255,0.35)" stroke-width="2" fill="none"/>
  <!-- top-right -->
  <path d="M432 80 L432 110 M432 80 L402 80" stroke="rgba(0,212,255,0.35)" stroke-width="2" fill="none"/>
  <!-- bottom-left -->
  <path d="M80 432 L80 402 M80 432 L110 432" stroke="rgba(0,212,255,0.35)" stroke-width="2" fill="none"/>
  <!-- bottom-right -->
  <path d="M432 432 L432 402 M432 432 L402 432" stroke="rgba(0,212,255,0.35)" stroke-width="2" fill="none"/>

  <!-- Layered stacked bars (Stratos = layers concept) -->
  <!-- Layer 3 (bottom) — purple, widest -->
  <rect x="128" y="336" width="256" height="22" rx="2"
    fill="rgba(124,58,237,0.18)" stroke="rgba(124,58,237,0.4)" stroke-width="1"/>
  <!-- Layer 2 (mid) — blended -->
  <rect x="148" y="308" width="216" height="22" rx="2"
    fill="rgba(99,102,241,0.22)" stroke="rgba(99,102,241,0.5)" stroke-width="1"/>
  <!-- Layer 1 (top) — cyan -->
  <rect x="168" y="280" width="176" height="22" rx="2"
    fill="rgba(0,212,255,0.18)" stroke="rgba(0,212,255,0.5)" stroke-width="1"/>

  <!-- Glow dots on left edges of bars -->
  <circle cx="128" cy="347" r="3" fill="#7c3aed" filter="url(#glow)" opacity="0.8"/>
  <circle cx="148" cy="319" r="3" fill="#6366f1" filter="url(#glow)" opacity="0.8"/>
  <circle cx="168" cy="291" r="3" fill="#00d4ff" filter="url(#glow)" opacity="0.9"/>

  <!-- Central "S" lettermark — bold, geometric, monospace-inspired -->
  <g filter="url(#glow)">
    <!-- S path: geometric/angular style matching terminal aesthetic -->
    <path d="
      M 296 148
      L 218 148
      C 203 148 192 159 192 174
      L 192 210
      C 192 225 203 236 218 236
      L 294 236
      C 302 236 308 242 308 250
      L 308 278
      C 308 286 302 292 294 292
      L 210 292
    "
    fill="none"
    stroke="url(#accentGrad)"
    stroke-width="28"
    stroke-linecap="square"
    stroke-linejoin="miter"
    opacity="0.95"
    />
  </g>

  <!-- S glow layer (softer, behind) -->
  <path d="
    M 296 148
    L 218 148
    C 203 148 192 159 192 174
    L 192 210
    C 192 225 203 236 218 236
    L 294 236
    C 302 236 308 242 308 250
    L 308 278
    C 308 286 302 292 294 292
    L 210 292
  "
  fill="none"
  stroke="url(#accentGrad)"
  stroke-width="42"
  stroke-linecap="square"
  opacity="0.08"
  />

  <!-- Scan line accent — top of S -->
  <line x1="192" y1="148" x2="308" y2="148" stroke="rgba(0,212,255,0.6)" stroke-width="1.5"/>
  <!-- Scan line accent — bottom of S -->
  <line x1="192" y1="292" x2="308" y2="292" stroke="rgba(124,58,237,0.6)" stroke-width="1.5"/>

  <!-- Top-right indicator dot (status) -->
  <circle cx="404" cy="108" r="6" fill="#10b981" opacity="0.9" filter="url(#glow)"/>
  <circle cx="404" cy="108" r="10" fill="none" stroke="#10b981" stroke-width="1" opacity="0.3"/>

</svg>
